  <main>
    <section class="contacto-hero">
      <h1>Contáctanos</h1>

      <div class="contacto__layout">
        <div class="redes">
          <h2>Visita nuestras<br>redes sociales</h2>
          <div class="redes__iconos">
            <a href="https://facebook.com/tecnoshop" target="_blank" rel="noopener" aria-label="Facebook">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.76 8.44-4.92 8.44-9.94z"/></svg>
            </a>
            <a href="https://instagram.com/tecnoshop" target="_blank" rel="noopener" aria-label="Instagram">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 2c2.72 0 3.06.01 4.12.06 1.06.05 1.79.22 2.43.47.66.25 1.22.6 1.77 1.15.55.55.9 1.11 1.15 1.77.25.64.42 1.37.47 2.43.05 1.06.06 1.4.06 4.12s-.01 3.06-.06 4.12c-.05 1.06-.22 1.79-.47 2.43a4.9 4.9 0 0 1-1.15 1.77 4.9 4.9 0 0 1-1.77 1.15c-.64.25-1.37.42-2.43.47-1.06.05-1.4.06-4.12.06s-3.06-.01-4.12-.06c-1.06-.05-1.79-.22-2.43-.47a4.9 4.9 0 0 1-1.77-1.15 4.9 4.9 0 0 1-1.15-1.77c-.25-.64-.42-1.37-.47-2.43C2.01 15.06 2 14.72 2 12s.01-3.06.06-4.12c.05-1.06.22-1.79.47-2.43.25-.66.6-1.22 1.15-1.77A4.9 4.9 0 0 1 5.45.53C6.09.28 6.82.11 7.88.06 8.94.01 9.28 0 12 0zm0 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.25A3.25 3.25 0 1 1 12 6.75a3.25 3.25 0 0 1 0 6.5zM17.5 4.25a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/></svg>
            </a>
            <a href="https://tiktok.com/@tecnoshop" target="_blank" rel="noopener" aria-label="TikTok">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M16.6 5.82c-.98-.86-1.6-2.1-1.6-3.48h-3.08v13.7c0 1.5-1.22 2.72-2.72 2.72a2.72 2.72 0 0 1 0-5.44c.26 0 .52.04.76.11V10.3a5.83 5.83 0 0 0-.76-.05A5.85 5.85 0 0 0 3.35 16.1 5.85 5.85 0 0 0 9.2 21.94a5.85 5.85 0 0 0 5.85-5.84V9.4a8.2 8.2 0 0 0 4.6 1.4V7.72a5.02 5.02 0 0 1-3.05-1.9z"/></svg>

            </a>
          </div>
        </div>

        <!-- Formulario sin backend: se envía por mailto: o WhatsApp
             (lógica en js/contacto.js, Quincena 8) -->
        <form class="form" id="form-contacto">
          <h2>Formulario de contacto</h2>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required>
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" required>
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" required>
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" required>
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" required></textarea>
          <button type="submit" class="btn">Enviar</button>
        </form>

        <div class="equipo-foto">
          <img src="assets/img/equipo.jpg" alt="Equipo de TecnoShop"><br> (se reemplazará por la foto real del equipo)
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">

  <button class="cart-float" aria-label="Ver carrito">🛒</button>
